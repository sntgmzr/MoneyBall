name: Actualizar datos

on:
  schedule:
    # Hora de México (UTC-6): 7:17, 11:17, 15:17 y 19:17
    - cron: "17 13,17,21 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/update.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0
      - name: Descargar y procesar datos
        run: python scraper/update.py
      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "moneyball-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json scraper/history.json scraper/ids.json scraper/last_run.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Datos $(TZ=America/Mexico_City date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
